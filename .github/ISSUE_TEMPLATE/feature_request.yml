name: Feature request
description: Something new you would like it to do
labels: [enhancement]
body:
  - type: textarea
    id: goal
    attributes:
      label: What you want to do
      description: The task or question you have in mind, not yet the solution.
    validations:
      required: true
  - type: textarea
    id: today
    attributes:
      label: How you do it today
      description: The workaround, if there is one, and what is hard about it.
  - type: textarea
    id: idea
    attributes:
      label: An idea of how it could work
  - type: checkboxes
    id: help
    attributes:
      label: Contributing
      options:
        - label: I would like to work on this myself.
