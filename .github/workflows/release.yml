# A v* tag builds the release the installers take (tools/release/build.sh) and publishes it.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"  # npm 10 (Node 22) fails installing the viewer's workspaces
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: wasm-pack
        run: |
          curl -fsSL https://github.com/rustwasm/wasm-pack/releases/download/v0.15.0/wasm-pack-v0.15.0-x86_64-unknown-linux-musl.tar.gz \
            | tar xz -C /tmp
          install -m 755 /tmp/wasm-pack-v0.15.0-x86_64-unknown-linux-musl/wasm-pack ~/.cargo/bin/
      - run: tools/release/build.sh release
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: "release/*"
      - run: gh release create "$GITHUB_REF_NAME" release/* --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}

  # The release's own wheel to PyPI as graph-me-maybe, through Trusted Publishing (no token kept):
  # PyPI trusts this repository's release.yml in the `pypi` environment. A job of its own, so a
  # failed upload leaves the release standing; re-run this job, not a new tag.
  pypi:
    needs: release
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - run: |
          gh release download "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
            --pattern '*.whl' --pattern SHA256SUMS --dir release
          cd release && sha256sum --check --ignore-missing SHA256SUMS
          mkdir ../dist && mv ./*.whl ../dist/
        env:
          GH_TOKEN: ${{ github.token }}
      - uses: pypa/gh-action-pypi-publish@release/v1
